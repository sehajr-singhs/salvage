[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "salvage"
version = "0.1.0"
description = "Salvage: an agent that finds working parts inside dead electronics, proves them before it labels them, and walks your hands through getting them out."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "pillow>=10.0",
    "numpy>=1.26",
    "pytest>=8.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# typeguard 4.1.2 is installed globally but cannot import on Python 3.14
# (ast.Str was removed); it is not a Salvage dependency, so leave it off.
addopts = "-p no:typeguard"
